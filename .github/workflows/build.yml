name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: git update-index --chmod=+x gradlew
      shell: bash

    - name: Build and test with Gradle
      run: .\gradlew.bat test fatJar --no-daemon

    - name: Upload executable JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: AudioSwitcher-win-x64
        path: build/libs/audio-switcher-1.0.0-all.jar

    - name: Create GitHub release (tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: build/libs/audio-switcher-1.0.0-all.jar
        generate_release_notes: true

    - name: Create GitHub release (every push to main)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Audio Switcher v1.0.${{ github.run_number }}
        target_commitish: ${{ github.sha }}
        files: build/libs/audio-switcher-1.0.0-all.jar
        generate_release_notes: true
        make_latest: true
